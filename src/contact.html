<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Us for More Information">
    <title>Contact Us | Blogging Website</title>
    <link rel="stylesheet" href="../styles/contact.css">
</head>

<body>
    <header>
        <div class="container">
            <h1>My Blogging Website</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Introduction</a></li>
                    <li><a href="home.html">Home</a></li>
                    <li><a href="blog.html">Blog</a></li>

                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="contact-us">
            <div class="container">
                <h2>Contact Us</h2>
                <p>Have questions? Feel free to reach out to us using the contact form below.</p>
                <form action="#" method="POST">
                    <label for="name">Your Name:</label>
                    <input type="text" id="name" name="name" required>

                    <label for="email">Your Email:</label>
                    <input type="email" id="email" name="email" required>

                    <label for="message">Your Message:</label>
                    <textarea id="message" name="message" rows="4" required></textarea>

                    <button type="submit">Submit</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 My Blogging Website | All Rights Reserved.</p>
        </div>
    </footer>
</body>

</html>
