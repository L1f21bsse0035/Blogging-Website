name: deploy-development

on:
  push:
    branches:
      - develop  

jobs:
  build-job:
    runs-on: ubuntu-latest 
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4  
      - name: Build Website
        run: |
          npx parcel build "./src/index.html" --dist-dir "./docs" --public-url "./"  
      - name: Disable Jekyll
        run: echo > ./docs/.nojekyll
      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3  
        with:
          path: "./docs"  
          name: "develop-artifact"  

  deploy-job:
    needs: build-job  
    permissions:
      pages: write  
      id-token: write  
    environment: "deploy-env"  
    runs-on: ubuntu-latest  
    steps:
      - name: Deploy Build Artifacts on GH Pages
        uses: actions/deploy-pages@v4 
        with:
          artifact_name: "develop-artifact"  
          token: ${{github.token}}  
